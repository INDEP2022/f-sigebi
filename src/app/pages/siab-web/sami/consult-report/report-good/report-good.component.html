<app-card [header]="true">
  <div class="ch-content" header>
    <h5 class="title">Lista de bienes</h5>
  </div>
  <div body>
    <!-- <h5 class="title">
          <strong>Busqueda de Documentos de {{ title }}</strong>
        </h5> -->
    <p>
      <a
        class="text-color"
        (click)="showSearchForm = true"
        *ngIf="!showSearchForm">
        <i class="fa fa-angle-right" aria-hidden="true"></i>
        <strong> B&uacute;squeda de Bienes</strong></a
      >
    </p>

    <p>
      <a
        class="text-color"
        (click)="showSearchForm = false"
        *ngIf="showSearchForm">
        <i class="fa fa-angle-down" aria-hidden="true"></i>
        <strong> B&uacute;squeda de Bienes</strong></a
      >
    </p>

    <div *ngIf="showSearchForm">
      <form [formGroup]="form" class="form-material pt-3">
        <div class="row pt-5">
          <div class="col-md-4">
            <form-field [control]="form.get('goodId')" label="No. Bien">
              <input
                type="number"
                min="0"
                class="form-control"
                maxlength="100"
                formControlName="goodId" />
            </form-field>
          </div>

          <div class="col-md-4">
            <form-field
              [control]="form.get('inventoryNumber')"
              label="No. Inventario">
              <input
                type="text"
                class="form-control"
                maxlength="50"
                formControlName="inventoryNumber" />
            </form-field>
          </div>

          <div class="col-md-4">
            <form-field
              [control]="form.get('goodDescription')"
              label="Descripción del Bien">
              <input
                type="text"
                class="form-control"
                maxlength="100"
                formControlName="goodDescription" />
            </form-field>
          </div>
        </div>

        <div class="row pt-5">
          <div class="col-md-4">
            <form-field [control]="form.get('idRelevantType')">
              <ngx-select
                [form]="form"
                control="idRelevantType"
                [data]="typeRelevant"
                value="description"
                bindLabel="description"
                label="Tipo Relevante"
                (fetchItems)="getTypeRelevantSelect($event)"></ngx-select>
            </form-field>
          </div>

          <div class="col-md-4">
            <form-field [control]="form.get('requestId')" label="No. Solicitud">
              <input
                type="number"
                min="0"
                class="form-control"
                maxlength="50"
                formControlName="requestId" />
            </form-field>
          </div>
          <!-- Agregar ms de estatus -->

          <div class="col-md-4">
            <ng-custom-select-loading
              [form]="form"
              [path]="path"
              label="Estatus"
              formControlName="status"
              value="status"
              bindLabel="status"
              paramSearch="filter.status"
              prefixSearch="$ilike"></ng-custom-select-loading>
            <!-- <form-field [control]="form.get('status')" label="Estatus Bien">
              <input
                type="text"
                class="form-control"
                maxlength="100"
                formControlName="status" />
            </form-field> -->
          </div>
        </div>

        <div class="row pt-5">
          <div class="col-md-4">
            <form-field [control]="form.get('uniqueKey')" label="Clave Única">
              <input
                type="text"
                class="form-control"
                maxlength="100"
                formControlName="uniqueKey" />
            </form-field>
          </div>

          <div class="col-md-4">
            <form-field
              [control]="form.get('fileNumber')"
              label="No. Expediente">
              <input
                type="number"
                class="form-control"
                maxlength="50"
                formControlName="fileNumber" />
            </form-field>
          </div>

          <div class="col-md-4">
            <!--
              <form-field
                [control]="form.get('unitMeasurement')"
                label="Unidad de Medida">
                <input
                  type="text"
                  class="form-control"
                  maxlength="100"
                  formControlName="unitMeasurement" />
              </form-field>
            -->

            <form-field [control]="form.get('measureTlUnitView')">
              <ngx-select
                [form]="form"
                control="measureTlUnitView"
                [showTooltip]="true"
                [data]="measureUnits"
                value="measureTlUnit"
                bindLabel="measureTlUnit"
                label="Unidad de Medida"
                (fetchItems)="getUnitMeasure($event)"></ngx-select>
            </form-field>
          </div>
        </div>

        <div class="row pt-5">
          <div class="col-md-4">
            <form-field [control]="form.get('descriptionPhysicalStatus')">
              <ngx-select
                [form]="form"
                control="descriptionPhysicalStatus"
                [showTooltip]="true"
                [data]="physicalStatusData"
                value="name"
                bindLabel="name"
                label="Estado Físico"></ngx-select>
            </form-field>
          </div>

          <div class="col-md-4">
            <form-field [control]="form.get('descriptionConservationStatus')">
              <ngx-select
                [form]="form"
                control="descriptionConservationStatus"
                [showTooltip]="true"
                [data]="conservationStatus"
                value="name"
                bindLabel="name"
                label="Estado de Conservación"></ngx-select>
            </form-field>
          </div>

          <div class="col-md-4">
            <form-field [control]="form.get('transferId')">
              <ngx-select
                [form]="form"
                control="transferId"
                [showTooltip]="true"
                [data]="transferences"
                value="id"
                bindLabel="nameAndId"
                label="Transferente"
                (fetchItems)="getTransferentSelect($event)"></ngx-select>
            </form-field>
          </div>
        </div>
      </form>
    </div>

    <div class="row pt-2">
      <div class="d-flex justify-content-end">
        <div class="mr-auto p-2"></div>
        <div class="p-2">
          <button
            (click)="search()"
            class="btn btn-primary active btn-sm"
            style="height: 36px">
            Buscar <i class="bx bx-search-alt-2"></i>
          </button>
        </div>
        <div class="p-2">
          <button (click)="cleanForm()" class="btn btn-danger active btn-sm">
            Limpiar <i class="fas fa-eraser"> </i>
          </button>
        </div>
      </div>
    </div>

    <div class="row pt-5">
      <div class="justify-content-end d-flex">
        <confirm-button
          [loading]="loadingReport"
          [btnSmall]="true"
          [text]="'Reporte de Bienes'"
          [loadingText]="'Generando Reporte'"
          [className]="'btn-success ml-2'"
          [icon]="'bx bx-download float-icon'"
          class="mr-2"
          (confirm)="reportGoods()"></confirm-button>

        <app-columns-select
          [leftList]="true"
          [(settings)]="settings"></app-columns-select>
      </div>
      <div [class]="loading ? 'table-loading' : ''">
        <ng2-smart-table
          [attr.class]="'table-responsive pt-3'"
          [settings]="settings"
          [source]="paragraphs">
        </ng2-smart-table>
      </div>

      <app-pagination
        [params]="params"
        [totalItems]="totalItems"></app-pagination>
    </div>
  </div>
</app-card>
