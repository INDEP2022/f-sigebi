<app-card [header]="true">
  <div header>
    <div class="ch-content">
      <h5 class="title">{{ title }}</h5>
    </div>
  </div>
  <div body>
    <form class="form-material" [formGroup]="formEvent">
      <div class="row">
        <div class="col-md-4">
          <form-field [control]="formEvent.get('id')">
            <ngx-select
              [searchOnInit]="true"
              (change)="setValuesFormEvent($event)"
              [form]="formEvent"
              control="id"
              [data]="comerEventSelect"
              value="id"
              bindLabel="id"
              label="Evento"
              (fetchItems)="getComerEvents($event)">
            </ngx-select>
            <!-- <input
              class="form-control"
              formControlName="eventId"
              (keyup.enter)="searchEvent()" /> -->
          </form-field>
        </div>
        <div class="col-md-8">
          <form-field
            [control]="formEvent.get('processKey')"
            label="Cve Proceso">
            <input readonly class="form-control" formControlName="processKey" />
          </form-field>
        </div>
        <div class="col-md-6 mt-2">
          <form-field [control]="formEvent.get('descType')" label="Tipo">
            <input readonly class="form-control" formControlName="descType" />
          </form-field>
        </div>
        <div class="col-md-6 mt-2">
          <form-field [control]="formEvent.get('descStatus')" label="Estatus">
            <input readonly class="form-control" formControlName="descStatus" />
          </form-field>
        </div>
      </div>
      <div class="row text-center mt-2 mb-5">
        <div>
          <button
            type="button"
            class="btn active btn-primary btn-sm mr-3"
            (click)="searchEvent()">
            Buscar
            <i class="bx bx-search-alt bx-sm float-icon"></i>
          </button>
          <button
            type="button"
            class="btn btn-danger active btn-sm"
            (click)="clean()">
            Limpiar
            <i class="fas fa-eraser"></i>
          </button>
        </div>
      </div>
    </form>

    <accordion style="margin-bottom: 0px !important" [isAnimated]="true">
      <accordion-group
        id="testAcc"
        style="margin-bottom: 0px !important"
        [isOpen]="eventSelected"
        [class.disabled]="!eventSelected">
        <div accordion-heading class="d-flex justify-content-between">
          <h5>LOTES</h5>
        </div>
        <div class="col-12">
          <div class="row">
            <form-loader *ngIf="loading"></form-loader>
          </div>
          <ng-scrollbar
            [track]="'all'"
            [ngStyle]="{ height: loading ? '0px' : '300px' }">
            <ng2-smart-table
              (userRowSelect)="selectRowGood($event.data)"
              [attr.class]="'table-bordered table-responsive'"
              [settings]="settings1"
              [source]="data1">
            </ng2-smart-table>
          </ng-scrollbar>
        </div>
        <app-pagination [params]="params" [totalItems]="totalItems1">
        </app-pagination>
        <div *ngIf="!loading" class="row mt-4">
          <form class="form-material" [formGroup]="form">
            <div class="col-md-6 text-center">
              <form-field
                [control]="form.get('descriptionPhoto')"
                label="Descripción de la Fotografia Favorita">
                <input
                  readonly
                  type="text"
                  class="form-control"
                  formControlName="descriptionPhoto" />
              </form-field>
            </div>
          </form>
        </div>
      </accordion-group>
    </accordion>

    <accordion
      style="margin-bottom: 0px !important"
      class="mt-3"
      [isAnimated]="true">
      <accordion-group
        id="testAcc"
        style="margin-bottom: 0px !important"
        [isOpen]="eventSelected && rowAllotment"
        [class.disabled]="!eventSelected || !rowAllotment">
        <div accordion-heading class="d-flex justify-content-between">
          <h5>BIENES DEL LOTE {{ rowAllotment }}</h5>
        </div>
        <div class="col-12">
          <div class="row">
            <form-loader *ngIf="loading2"></form-loader>
          </div>
          <ng-scrollbar
            [track]="'all'"
            [ngStyle]="{ height: loading2 ? '0px' : '300px' }">
            <ng2-smart-table
              (userRowSelect)="selectRow($event.data)"
              [attr.class]="'table-bordered table-responsive'"
              [settings]="settings2"
              [source]="data2">
            </ng2-smart-table>
          </ng-scrollbar>
        </div>
        <app-pagination [params]="params2" [totalItems]="totalItems2">
        </app-pagination>
      </accordion-group>
    </accordion>
    <accordion
      style="margin-bottom: 0px !important"
      class="mt-3"
      [isAnimated]="true">
      <accordion-group
        id="testAcc"
        style="margin-bottom: 0px !important"
        [isOpen]="eventSelected && rowAllotment && selectedGood"
        [class.disabled]="!eventSelected || !rowAllotment || !selectedGood">
        <div accordion-heading class="d-flex justify-content-between">
          <h5>FOTOGRAFÍAS</h5>
        </div>
        <form class="form-material" [formGroup]="form">
          <div class="row">
            <div class="col-md-4">
              <button
                (click)="public()"
                type="button"
                class="btn btn-primary btn-sm active"
                [disabled]="disableButton">
                Publicar como favorito
              </button>
            </div>
          </div>
          <div class="row py-5">
            <app-photos-list-commercial
              (fileEmiter)="fileEmiter($event)"
              [disabled]="disabled"
              [goodNumber]="goodNumber"></app-photos-list-commercial>
          </div>
          <!-- <div class="row pt-5">
            <carousel
              [itemsPerSlide]="itemsPerSlide"
              [singleSlideOffset]="singleSlideOffset"
              [startFromIndex]="6"
              [interval]="0">
              <slide *ngFor="let slide of slides; let index = index">
                <img
                  [src]="slide.image"
                  alt="image slide"
                  style="
                    display: block;
                    height: 250px;
                    width: 300px;
                    object-fit: cover;
                  " />
                <form-check for="keep-{{ index }}" class="float-check">
                  <input
                    type="checkbox"
                    id="keep-{{ index }}"
                    formControlName="favorite"
                    class="form-control" />
                </form-check>
                <div class="carousel-csaption">
                  <h6>Fotograf&iacute;a {{ index }}</h6>
                </div>
              </slide>
            </carousel>
          </div> -->
        </form>
      </accordion-group>
    </accordion>
  </div>
</app-card>
