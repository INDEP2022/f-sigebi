<app-card [header]="true">
  <div class="ch-content" header>
    <h5 class="title">cat&aacute;logo de proveedores</h5>
  </div>
  <div body>
    <div class="row">
      <div class="col-sm-12 col-md-12">
        <div class="d-flex flex-row-reverse my-3">
          <div class="">
            <app-columns-select
              [leftList]="true"
              [(settings)]="providerSettings"></app-columns-select>
          </div>
          <div>
            <button
              class="btn btn-sm btn-info active me-2"
              (click)="openFormProvider(false)">
              Nuevo <i class="bx bx-plus bx-sm float-icon"></i>
            </button>
          </div>
          <div>
            <button
              class="btn btn-sm btn-primary active me-2"
              (click)="openClientsModal()">
              Clientes
              <i class="bx bx-list-plus bx-sm float-icon"></i>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="mt-2">
      <form-loader *ngIf="loading"></form-loader>
      <ng-scrollbar
        [track]="'all'"
        [ngStyle]="{ height: loading ? '0px' : '300px' }">
        <div [class]="loading ? 'table-loading' : ''">
          <ng2-smart-table
            [attr.class]="'table-bordered table-responsive'"
            [settings]="providerSettings"
            [source]="data"
            (userRowSelect)="selectProvider($event.data)"
            (edit)="openFormProvider(true, $event.data)"
            (delete)="delete($event.data)">
          </ng2-smart-table>
        </div>
      </ng-scrollbar>
    </div>
    <app-pagination [params]="params" [totalItems]="totalItems">
    </app-pagination>
    <form class="form-material" [formGroup]="providerForm">
      <div class="row mt-4">
        <div class="col-sm-6 col-md-3 mb-2">
          <form-field
            [control]="providerForm.get('providerId')"
            label="Id Proveedor">
            <input
              [disabled]="true"
              type="number"
              class="form-control"
              formControlName="providerId" />
          </form-field>
        </div>
        <div class="col-sm-6 col-md-3 mb-2">
          <form-field [control]="providerForm.get('bank')" label="Banco">
            <input
              maxlength="30"
              type="text"
              class="form-control"
              formControlName="bank" />
          </form-field>
        </div>
        <div class="col-sm-6 col-md-3 mb-2">
          <form-field [control]="providerForm.get('branch')" label="Sucursal">
            <input
              maxlength="4"
              type="text"
              class="form-control"
              formControlName="branch" />
          </form-field>
        </div>
        <div class="col-sm-6 col-md-3 mb-2">
          <form-field
            [control]="providerForm.get('checkingCta')"
            label="No. Cuenta">
            <input
              maxlength="20"
              type="text"
              class="form-control"
              formControlName="checkingCta" />
          </form-field>
        </div>
        <div class="col-sm-6 col-md-3 mb-2">
          <form-field [control]="providerForm.get('key')" label="Clave">
            <input
              maxlength="20"
              type="text"
              class="form-control"
              formControlName="key" />
          </form-field>
        </div>
        <div class="col-sm-6 col-md-3 mb-2 text-center" *ngIf="isSelected">
          <button
            class="btn btn-primary btn-block btn-sm active"
            [disabled]="!providerForm.valid"
            (click)="saveBank()">
            Guardar Datos <i aria-hidden="true" class="fa fa-save"></i>
          </button>
        </div>
      </div>
    </form>
  </div>
</app-card>
