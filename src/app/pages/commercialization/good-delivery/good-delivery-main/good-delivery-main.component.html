<app-card [header]="true">
  <div class="ch-content" header>
    <h5 class="title">Cambio de Estatus a Bien Vendido y Entregado</h5>
  </div>
  <div body>
    <div class="row mt-2">
      <div class="col-sm-12 col-md-12">
        <div class="d-flex flex-row-reverse my-3">
          <div>
            <button
              class="btn btn-sm btn-primary active me-2 font-size-13"
              (click)="changeStatus()">
              Bien Entregado
            </button>
          </div>
          <div>
            <button
              (click)="resetTable()"
              tooltip="Limpia los filtros y elimina los bienes cargados del rastreador"
              containerClass="tooltip-style"
              class="btn btn-sm btn-danger active me-2">
              Limpiar Tabla
              <i class="fas fa-eraser"> </i>
            </button>
          </div>

          <div class="col-md-12-col-sm12 col-xs-12">
            <button class="btn btn-sm btn-primary active" (click)="getData()">
              Incorporar Bienes del Rastreador
            </button>
          </div>
        </div>
      </div>
    </div>
    <div class="mt-2">
      <div class="row">
        <form-loader *ngIf="loading"></form-loader>
      </div>
      <ng-scrollbar
        [track]="'all'"
        [ngStyle]="{ height: loading ? '0px' : '400px' }">
        <div [class]="loading ? 'table-loading' : ''">
          <ng2-smart-table [settings]="goodsSettings" [source]="data">
          </ng2-smart-table>
        </div>
      </ng-scrollbar>
    </div>
    <app-pagination [params]="params" [totalItems]="totalItems">
    </app-pagination>
  </div>
</app-card>
