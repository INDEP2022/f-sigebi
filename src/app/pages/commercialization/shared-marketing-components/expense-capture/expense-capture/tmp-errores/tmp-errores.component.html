<accordion [isAnimated]="true">
  <accordion-group [isOpen]="true" (isOpenChange)="toggleInformation = $event">
    <div accordion-heading class="d-flex justify-content-between">
      <h5>Errores en validación</h5>
      <i
        class="bx bx-chevron-down bx-md float-icon-md"
        style="float: right"
        [ngClass]="{
          'rotate-down': toggleInformation,
          'rotate-up': !toggleInformation
        }"></i>
    </div>
    <form-loader *ngIf="loading"></form-loader>
    <div class="pt-4">
      <ng-scrollbar
        [track]="'all'"
        [ngStyle]="{ height: loading ? '0px' : '300px' }">
        <ng2-smart-table
          [attr.class]="'table-responsive table-bordered'"
          [settings]="settings"
          [source]="dataPaginated">
        </ng2-smart-table>
      </ng-scrollbar>
      <app-pagination [params]="params" [totalItems]="totalItems">
      </app-pagination></div></accordion-group
></accordion>
