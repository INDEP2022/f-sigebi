<app-card [header]="true">
  <div class="ch-content" header>
    <h5 class="title">Reporte Devoluciones y Decomisos de Bienes</h5>
  </div>

  <div body class="mb-5">
    <form [formGroup]="returnConfiscationForm" class="form-material">
      <div class="row">
        <div class="col-md-12">
          <app-delegation-shared
            [valPhaseEdo]="true"
            [init]="true"
            [form]="returnConfiscationForm"
            [subdelegationField]="'subdelegation'"
            [delegationField]="'delegation'"
            [showDelegation]="true"
            [showSubdelegation]="true"
            (emitSubdelegation)="seleccionarSubDelegacion($event)"
            (emitDelegation)="seleccionarDelegation($event)">
          </app-delegation-shared>
        </div>
      </div>
      <div class="row mt-2">
        <div class="col-md-3">
          <form-field
            [control]="returnConfiscationForm.get('ofTheGood')"
            label="Del Bien">
            <input
              type="number"
              [min]="0"
              [maxlength]="15"
              class="form-control"
              formControlName="ofTheGood" />
          </form-field>
        </div>
        <div class="col-md-3">
          <form-field
            [control]="returnConfiscationForm.get('toGood')"
            label="Al Bien">
            <input
              type="number"
              [min]="returnConfiscationForm.get('ofTheGood').value + 1"
              [maxlength]="15"
              [disabled]="
                returnConfiscationForm.get('ofTheGood').value != null
                  ? true
                  : false
              "
              class="form-control"
              formControlName="toGood" />
          </form-field>
        </div>
        <div class="col-md-3">
          <form-field
            [control]="returnConfiscationForm.get('receiptDateOf')"
            label="Desde">
            <input
              bsDatepicker
              class="form-control"
              [maxlength]="10"
              formControlName="receiptDateOf" />
          </form-field>
        </div>
        <div class="col-md-3">
          <form-field
            [control]="returnConfiscationForm.get('receptionDateTo')"
            label="Hasta">
            <input
              bsDatepicker
              [maxlength]="10"
              [minDate]="returnConfiscationForm.get('receiptDateOf').value"
              class="form-control"
              [class]="
                this.returnConfiscationForm.get('receiptDateOf').value != null
                  ? ''
                  : 'disabled'
              "
              formControlName="receptionDateTo" />
          </form-field>
        </div>
      </div>
      <div class="row mt-2">
        <div class="col-md-3">
          <form-field
            label="Tipo Movimiento"
            [control]="returnConfiscationForm.get('movementType')">
            <ng-select class="form-control" formControlName="movementType">
              <ng-option [value]="'DEVOLUCION'">DEVOLUCIÓN</ng-option>
              <ng-option [value]="'DECOMISO'">DECOMISO</ng-option>
            </ng-select>
          </form-field>
        </div>
      </div>

      <div class="text-center justify-content-center d-flex">
        <div class="">
          <button
            type="button"
            class="btn btn-primary active btn-sm mr-2"
            (click)="validaGood()"
            [disabled]="!returnConfiscationForm.valid">
            Imprimir <i class="bx bx-printer bx-sm float-icon"></i>
          </button>
        </div>
        <div class="">
          <button class="btn btn-danger btn-sm active" (click)="clearAll()">
            Limpiar <i class="fas fa-eraser"> </i>
          </button>
        </div>
      </div>
    </form>
  </div>
</app-card>
