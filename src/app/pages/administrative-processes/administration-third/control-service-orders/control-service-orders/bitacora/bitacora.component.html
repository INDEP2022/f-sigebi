<app-modal>
  <div header>
    <h5 class="modal-title">BITÁCORA</h5>
  </div>
  <div body>
    <div class="row pt-3">
      <form-loader *ngIf="loading"></form-loader>
      <div>
        <ng2-smart-table
          [ngStyle]="{
            height: loading ? '0px' : totalItems > 10 ? '300px' : 'auto'
          }"
          [attr.class]="'table-bordered table-responsive mb-4'"
          [attr.class]="'table-bordered table-responsive'"
          [settings]="settings"
          [source]="tableSource">
        </ng2-smart-table>
      </div>
      <app-pagination
        [params]="params"
        [totalItems]="totalItems"></app-pagination>
    </div>
  </div>
  <div footer>
    <div class="d-flex justify-content-center">
      <div class="m-3">
        <button
          type="button"
          class="btn btn-sm btn-danger active"
          (click)="close()">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</app-modal>
