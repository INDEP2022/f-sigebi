<app-card [header]="true">
  <div class="ch-content" header>
    <h5 class="title">Control de las ordenes de servicio</h5>
  </div>
  <div body>
    <accordion [isAnimated]="true">
      <accordion-group [isOpen]="true" [class.disabled]="false">
        <div accordion-heading class="d-flex justify-content-between">
          <h5>
            <i class="fa fa-filter" aria-hidden="true"></i> PARÁMETROS DE
            BÚSQUEDA
          </h5>
        </div>
        <form [formGroup]="serviceOrdersForm" class="form-material">
          <div class="row margin-input">
            <div class="col-md-4">
              <form-field [control]="serviceOrdersForm.get('delegation')">
                <ngx-select
                  (fetchItems)="getDelegations($event)"
                  [data]="delegations"
                  [form]="serviceOrdersForm"
                  value="id"
                  bindLabel="idDesc"
                  label="Delegación Regional"
                  [control]="'delegation'"
                  (change)="onDelegationsChange($event)"
                  [showTooltip]="true">
                </ngx-select>
              </form-field>
            </div>
            <div class="col-md-2">
              <form-field
                [control]="serviceOrdersForm.get('process')"
                label="Proceso">
                <input
                  maxlength="2"
                  type="text"
                  class="form-control"
                  formControlName="process" />
              </form-field>
            </div>
            <div class="col-md-3">
              <form-field
                [control]="serviceOrdersForm.get('dateInitial')"
                label="Fecha Inicial">
                <input
                  type="text"
                  formControlName="dateInitial"
                  class="form-control"
                  bsDatepicker
                  [maxDate]="
                    serviceOrdersForm.get('datefinal').value || maxDate
                  " />
              </form-field>
            </div>
            <div class="col-md-3">
              <form-field
                [control]="serviceOrdersForm.get('datefinal')"
                label="Fecha Final">
                <input
                  type="text"
                  formControlName="datefinal"
                  class="form-control"
                  bsDatepicker
                  [maxDate]="maxDate"
                  [minDate]="serviceOrdersForm.get('dateInitial').value" />
              </form-field>
            </div>
          </div>
          <div class="d-flex justify-content-center">
            <div>
              <button
                type="button"
                class="btn btn-primary active btn-sm mr-3"
                (click)="prepareFilters()">
                Buscar
                <i class="bx bx-search-alt bx-sm float-icon"></i>
              </button>
            </div>
            <div>
              <button
                class="btn btn-danger btn-sm active mr-3"
                (click)="resetFilter()">
                Limpiar <i class="fas fa-eraser"> </i>
              </button>
            </div>
          </div>
        </form>
      </accordion-group>
    </accordion>

    <app-card [header]="true">
      <div class="ch-content" header>
        <h5 class="title">Estrategias de formato</h5>
      </div>
      <div body>
        <div class="mt-5">
          <div class="d-flex justify-content-end">
            <div>
              <button
                (click)="openForm()"
                [disabled]="!selectedRow"
                type="button"
                class="btn btn-sm btn-primary active mr-3">
                Ir a Bitácora
              </button>
            </div>
            <div>
              <app-columns-select
                [leftList]="true"
                [(settings)]="settings"></app-columns-select>
            </div>
          </div>
        </div>
        <div class="row pt-3">
          <form-loader *ngIf="loading"></form-loader>
          <div>
            <ng2-smart-table
              #myTable
              [ngStyle]="{
                height: loading ? '0px' : totalItems > 10 ? '600px' : 'auto'
              }"
              [attr.class]="'table-bordered table-responsive mb-4'"
              [attr.class]="'table-bordered table-responsive'"
              [settings]="settings"
              [source]="tableSource"
              (userRowSelect)="onRowSelect($event)"
              (dblclick)="loadForm()">
            </ng2-smart-table>
          </div>
          <app-pagination
            [params]="params"
            [totalItems]="totalItems"></app-pagination>
        </div>
      </div>
    </app-card>
  </div>
</app-card>
