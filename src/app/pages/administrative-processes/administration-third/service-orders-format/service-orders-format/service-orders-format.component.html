<div class="row">
  <div class="col-8">
    <app-card [header]="true">
      <div class="ch-content" header>
        <h5 class="title">Orden de Servicio</h5>
      </div>
      <div body>
        <div class="d-flex justify-content-end mb-5">
          <div class="">
            <button
              [disabled]="form.invalid"
              type="button"
              class="btn btn-primary btn-sm active m-1"
              (click)="save()">
              {{ true ? 'Guardar' : 'Actualizar' }}
              <i
                aria-hidden="true"
                [class]="true ? 'fa fa-save' : 'fas fa-sync-alt'">
              </i>
            </button>
          </div>
          <div class="">
            <button
              button
              type="button"
              class="btn btn-danger btn-sm active m-1"
              (click)="newOrden()">
              Limpiar
              <i class="fas fa-eraser"> </i>
            </button>
          </div>
          <div class="">
            <button
              (click)="openSelect()"
              class="btn btn-primary btn-sm active m-1"
              tooltip="Lista de Expedientes"
              containerClass="tooltip-style">
              <i class="bx bx-list-plus bx-sm float-icon"></i>
            </button>
          </div>
        </div>
        <form [formGroup]="form" class="form-material">
          <div class="row">
            <div class="col-md-6 mt-2">
              <form-field [control]="form.get('typeStrategy')" label="Tipo">
                <ng-select class="form-control" formControlName="typeStrategy">
                  <ng-option value="N">Normal</ng-option>
                  <ng-option value="E">Especial</ng-option>
                </ng-select>
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field [control]="form.get('processNumber')">
                <ngx-select
                  [searchOnInit]="true"
                  (fetchItems)="getProcess($event)"
                  [data]="processSelect"
                  [form]="form"
                  value="processNumber"
                  (change)="changeProcess($event)"
                  bindLabel="idDesc"
                  label="Proceso"
                  [control]="'processNumber'"
                  [showTooltip]="true">
                </ngx-select>
                <!-- <input type="number" formControlName="process" class="form-control" min="0" max="99"
                  [readonly]="false" /> -->
              </form-field>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mt-2">
              <form-field [control]="form.get('delegation1Number')">
                <ngx-select
                  [readonly]="true"
                  [searchOnInit]="true"
                  (fetchItems)="getDelegations($event)"
                  [data]="delegations"
                  [form]="form"
                  value="id"
                  bindLabel="idDesc"
                  label="Coordinación Regional"
                  [control]="'delegation1Number'"
                  (change)="onDelegationsChange($event)"
                  [showTooltip]="true">
                </ngx-select>
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field
                [control]="form.get('captureDate')"
                label="Fecha de captura">
                <input
                  [ngClass]="{ 'not-press bg-gray': true }"
                  type="text"
                  formControlName="captureDate"
                  class="form-control disable"
                  bsDatepicker />
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field
                [control]="form.get('formatKey')"
                label="Cve. Orden de servicio">
                <input
                  type="text"
                  formControlName="formatKey"
                  class="form-control"
                  [readonly]="true" />
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field
                [control]="form.get('authorizeDate')"
                label="Fecha Autorización/Cancelación">
                <input
                  [ngClass]="{ 'not-press bg-gray': true }"
                  type="text"
                  formControlName="authorizeDate"
                  class="form-control"
                  bsDatepicker />
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field
                [control]="form.get('uniqueKey')"
                label="Cve. única de 3 niveles">
                <input
                  type="text"
                  formControlName="uniqueKey"
                  class="form-control" />
              </form-field>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mt-2">
              <form-field [control]="form.get('transferenceNumber')">
                <ngx-select
                  [searchOnInit]="true"
                  (fetchItems)="getTransference($event)"
                  [data]="transferenceSele"
                  [form]="form"
                  value="id"
                  bindLabel="nameTransferent"
                  label="Transferente"
                  control="transferenceNumber"
                  (change)="ontransferenceChange($event)">
                </ngx-select>
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field [control]="form.get('stationNumber')">
                <ngx-select
                  [readonly]="!transferenceChange"
                  (fetchItems)="getStation($event)"
                  [data]="stationSele"
                  [form]="form"
                  value="id"
                  (change)="onStationChange($event)"
                  bindLabel="stationName"
                  label="Emisora"
                  control="stationNumber">
                </ngx-select>
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field [control]="form.get('authorityNumber')">
                <ngx-select
                  [readonly]="!transferenceChange || !stationChange"
                  (fetchItems)="getAuthority($event)"
                  [data]="autoritySele"
                  [form]="form"
                  value="idAuthority"
                  bindLabel="authorityName"
                  label="Autoridad"
                  control="authorityNumber">
                </ngx-select>
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field [control]="form.get('storeNumber')">
                <ngx-select
                  (change)="changeAlmacen($event)"
                  (fetchItems)="getKeyStore($event)"
                  [data]="storeSele"
                  [form]="form"
                  value="noStore"
                  bindLabel="store"
                  label="Clave almacén"
                  control="storeNumber">
                </ngx-select>
              </form-field>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 mt-2">
              <form-field [control]="form.get('location')" label="Ubicación">
                <input
                  type="text"
                  formControlName="location"
                  class="form-control"
                  [readonly]="true" />
              </form-field>
            </div>
            <div class="col-md-12 mt-2">
              <form-field
                [control]="form.get('municipality')"
                label="Municipio">
                <input
                  type="text"
                  formControlName="municipality"
                  class="form-control"
                  [readonly]="true" />
              </form-field>
            </div>
            <div class="col-md-12 mt-2">
              <form-field [control]="form.get('entity')" label="Entidad">
                <input
                  type="text"
                  formControlName="entity"
                  class="form-control"
                  [readonly]="true" />
              </form-field>
            </div>
            <div class="col-md-3 mt-2">
              <form-field
                [control]="form.get('folSupplier')"
                label="Folio Proveedor">
                <input
                  type="text"
                  formControlName="folSupplier"
                  class="form-control"
                  [readonly]="false" />
              </form-field>
            </div>
          </div>
        </form>
        <div class="row pt-4">
          <div class="col-md-12">
            <div [class]="loading ? 'table-loading' : ''">
              <ng2-smart-table
                [attr.class]="'table-bordered table-responsive'"
                [settings]="settings"
                [source]="dataLocalB">
              </ng2-smart-table>
            </div>
          </div>
          <app-pagination
            [params]="paramsB"
            [totalItems]="totalItemsB"></app-pagination>
        </div>
        <div class="d-flex justify-content-center">
          <div>
            <button
              class="btn btn-primary btn-sm active mr-2"
              (click)="Incorpora()">
              Incorpora Bienes
            </button>
          </div>
          <div>
            <button
              [disabled]="deleteGoodsDisabled"
              class="btn btn-danger btn-sm active mr-2"
              (click)="deleteGoods()">
              Eliminar Bienes
            </button>
          </div>
          <div>
            <button
              class="btn btn-primary btn-sm active mr-2"
              (click)="Gprogram()">
              G. Programación
            </button>
          </div>
        </div>
      </div>
    </app-card>
  </div>
  <div class="col-4">
    <div class="row">
      <div class="col-12">
        <app-card [header]="true">
          <div class="ch-content" header>
            <h5 class="title">Fechas Eventos</h5>
          </div>
          <div body class="row">
            <form [formGroup]="form" class="form-material">
              <div class="col-12">
                <form-field [control]="form.get('iniEventDate')" label="Inicio">
                  <input
                    type="text"
                    formControlName="iniEventDate"
                    class="form-control"
                    bsDatepicker />
                </form-field>
              </div>
              <div class="col-12">
                <form-field
                  [control]="form.get('finEventDate')"
                  label="Término">
                  <input
                    type="text"
                    formControlName="finEventDate"
                    class="form-control"
                    bsDatepicker
                    [minDate]="form.get('iniEventDate').value" />
                </form-field>
              </div>
              <div class="col-md-4 mt-2">
                <form-field [control]="form.get('hraEvent')" label="Hora">
                  <input
                    type="number"
                    formControlName="hraEvent"
                    class="form-control"
                    min="1"
                    max="23"
                    [readonly]="false" />
                </form-field>
              </div>
              <div class="col-md-4 mt-2">
                <form-field [control]="form.get('minEvent')" label="Minuto">
                  <input
                    type="number"
                    formControlName="minEvent"
                    class="form-control"
                    min="0"
                    max="59"
                    [readonly]="false" />
                </form-field>
              </div>
              <div class="col-md-4 mt-2">
                <form-field [control]="form.get('hriEvent')" label="Horario">
                  <ng-select class="form-control" formControlName="hriEvent">
                    <ng-option value="AM">A.M</ng-option>
                    <ng-option value="PM">P.M</ng-option>
                  </ng-select>
                </form-field>
              </div>
            </form>
          </div>
        </app-card>
      </div>
      <div class="col-12">
        <app-card [header]="true">
          <div class="ch-content" header>
            <h5 class="title">Cambio Estatus</h5>
          </div>
          <div body class="row">
            <form [formGroup]="form" class="form-material">
              <div class="col-12">
                <form-field [control]="form.get('status')" label="Estatus">
                  <ng-select
                    [readonly]="!form.get('id').value"
                    class="form-control"
                    formControlName="status">
                    <ng-option value="AUTORIZADA">Autorizada</ng-option>
                    <ng-option value="CANCELADA">Cancelada</ng-option>
                    <ng-option value="PROCESO">Proceso</ng-option>
                    <ng-option value="RECHAZADO">Rechazado</ng-option>
                  </ng-select>
                </form-field>
                <div>
                  <button
                    class="btn btn-primary btn-block btn-sm active"
                    (click)="openEstate()">
                    Histórico
                  </button>
                </div>
              </div>
            </form>
          </div>
        </app-card>
      </div>
      <div class="col-12">
        <app-card [header]="true">
          <div class="ch-content" header>
            <h5 class="title">Justificación</h5>
          </div>
          <div body class="row">
            <form [formGroup]="form3" class="form-material">
              <div class="col-12">
                <form-field
                  [control]="form3.get('justification')"
                  label="Justificación">
                  <textarea
                    maxlength="200"
                    formControlName="justification"
                    class="form-control"
                    cols="5"
                    rows="5"></textarea>
                </form-field>
                <div>
                  <button
                    [disabled]="!numberFormat"
                    class="btn btn-primary btn-block btn-sm active"
                    (click)="insertBitacora()">
                    Aplica
                  </button>
                </div>
              </div>
            </form>
          </div>
        </app-card>
      </div>
    </div>
  </div>
  <div class="col-12">
    <app-card [header]="true">
      <div class="ch-content" header>
        <h5 class="title">Control de las Ordenes de Servicio</h5>
      </div>
      <div body>
        <div class="d-flex justify-content-end">
          <div class="">
            <button
              button
              type="button"
              class="btn btn-info btn-sm active mr-3"
              (click)="formImport()">
              Nuevo
              <i class="bx bx-plus bx-sm float-icon"></i>
            </button>
          </div>
          <app-columns-select
            [defaultColumns]="8"
            [leftList]="true"
            [(settings)]="settings2"></app-columns-select>
        </div>
        <div class="row pt-3">
          <form-loader *ngIf="loading2"></form-loader>
          <div>
            <ng2-smart-table
              [ngStyle]="{
                height: loading2 ? '0px' : totalItemsI > 10 ? '300px' : 'auto'
              }"
              [settings]="settings2"
              (edit)="formImport($event.data)"
              (delete)="removeImport($event)"
              [source]="dataLocalI"
              [attr.class]="'table-bordered table-responsive'">
            </ng2-smart-table>
          </div>
          <app-pagination
            [params]="paramsI"
            [totalItems]="totalItemsI"></app-pagination>
        </div>
        <form [formGroup]="form2">
          <div class="d-flex justify-content-end">
            <form-field [control]="form2.get('totalStrategy')">
              <label for="">Total Importe</label>
              <input
                currencyMask
                readonly
                type="text"
                class="form-control"
                formControlName="totalStrategy" />
            </form-field>
          </div>
        </form>
      </div>
    </app-card>
  </div>
</div>
