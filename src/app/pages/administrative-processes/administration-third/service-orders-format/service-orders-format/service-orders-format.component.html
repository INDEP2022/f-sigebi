<div class="row">
  <div class="col-8">
    <app-card [header]="true">
      <div class="ch-content" header>
        <h5 class="title">Orden de Servicio</h5>
      </div>
      <div body>
        <div class="d-flex justify-content-end mb-5">
          <div class="">
            <button
              type="button"
              class="btn btn-primary btn-sm active m-1"
              (click)="save()">
              {{ true ? 'Guardar' : 'Actualizar' }}
              <i
                aria-hidden="true"
                [class]="true ? 'fa fa-save' : 'fas fa-sync-alt'">
              </i>
            </button>
          </div>
          <div class="">
            <button
              button
              type="button"
              class="btn btn-danger btn-sm active m-1"
              (click)="newOrden()">
              Limpiar
              <i class="fas fa-eraser"> </i>
            </button>
          </div>
          <div class="">
            <button
              (click)="openSelect()"
              class="btn btn-primary btn-sm active m-1"
              tooltip="Lista de Expedientes"
              containerClass="tooltip-style">
              <i class="bx bx-list-plus bx-sm float-icon"></i>
            </button>
          </div>
        </div>
        <form [formGroup]="serviceOrdersForm" class="form-material">
          <div class="row">
            <div class="col-md-6 mt-2">
              <form-field
                [control]="serviceOrdersForm.get('type')"
                label="Tipo">
                <ng-select class="form-control" formControlName="type">
                  <ng-option value="N">Normal</ng-option>
                  <ng-option value="E">Especial</ng-option>
                </ng-select>
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field [control]="serviceOrdersForm.get('processNumber')">
                <ngx-select
                  [searchOnInit]="true"
                  (fetchItems)="getProcess($event)"
                  [data]="processSelect"
                  [form]="serviceOrdersForm"
                  value="processNumber"
                  bindLabel="idDesc"
                  label="Proceso"
                  [control]="'processNumber'"
                  [showTooltip]="true">
                </ngx-select>
                <!-- <input type="number" formControlName="process" class="form-control" min="0" max="99"
                  [readonly]="false" /> -->
              </form-field>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mt-2">
              <form-field
                [control]="serviceOrdersForm.get('regionalCoordination')">
                <ngx-select
                  [readonly]="true"
                  [searchOnInit]="true"
                  (fetchItems)="getDelegations($event)"
                  [data]="delegations"
                  [form]="serviceOrdersForm"
                  value="id"
                  bindLabel="idDesc"
                  label="Coordinación Regional"
                  [control]="'regionalCoordination'"
                  (change)="onDelegationsChange($event)"
                  [showTooltip]="true">
                </ngx-select>
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field
                [control]="serviceOrdersForm.get('captureDate')"
                label="Fecha de captura">
                <input
                  type="text"
                  formControlName="captureDate"
                  class="form-control disable"
                  bsDatepicker />
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field
                [control]="serviceOrdersForm.get('serviceOrderKey')"
                label="Cve. Orden de servicio">
                <input
                  type="text"
                  formControlName="serviceOrderKey"
                  class="form-control"
                  [readonly]="true" />
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field
                [control]="
                  serviceOrdersForm.get('cancellationAuthorizationDate')
                "
                label="Fecha Autorización/Cancelación">
                <input
                  type="text"
                  formControlName="cancellationAuthorizationDate"
                  class="form-control"
                  bsDatepicker />
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field
                [control]="serviceOrdersForm.get('uniqueKey')"
                label="Cve. única de 3 niveles">
                <input
                  type="text"
                  formControlName="uniqueKey"
                  class="form-control"
                  [readonly]="true" />
              </form-field>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mt-2">
              <form-field [control]="serviceOrdersForm.get('transference')">
                <ngx-select
                  [searchOnInit]="true"
                  (fetchItems)="getTransference($event)"
                  [data]="transferenceSele"
                  [form]="serviceOrdersForm"
                  value="id"
                  bindLabel="idDesc"
                  label="Transferente"
                  control="transference"
                  (change)="ontransferenceChange($event)">
                </ngx-select>
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field [control]="serviceOrdersForm.get('station')">
                <ngx-select
                  [readonly]="!transferenceChange"
                  (fetchItems)="getStation($event)"
                  [data]="stationSele"
                  [form]="serviceOrdersForm"
                  value="id"
                  (change)="onStationChange($event)"
                  bindLabel="stationName"
                  label="Emisora"
                  control="station">
                </ngx-select>
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field [control]="serviceOrdersForm.get('authority')">
                <ngx-select
                  [readonly]="!transferenceChange || !stationChange"
                  (fetchItems)="getAuthority($event)"
                  [data]="autoritySele"
                  [form]="serviceOrdersForm"
                  value="idAuthority"
                  bindLabel="authorityName"
                  label="Autoridad"
                  control="authority">
                </ngx-select>
              </form-field>
            </div>
            <div class="col-md-6 mt-2">
              <form-field [control]="serviceOrdersForm.get('keyStore')">
                <ngx-select
                  [searchOnInit]="true"
                  (fetchItems)="getKeyStore($event)"
                  [data]="storeSele"
                  [form]="serviceOrdersForm"
                  value="noStore"
                  bindLabel="store"
                  label="Clave almacén"
                  control="keyStore">
                </ngx-select>
              </form-field>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12 mt-2">
              <form-field
                [control]="serviceOrdersForm.get('location')"
                label="Ubicación">
                <input
                  type="text"
                  formControlName="location"
                  class="form-control"
                  [readonly]="true" />
              </form-field>
            </div>
            <div class="col-md-12 mt-2">
              <form-field
                [control]="serviceOrdersForm.get('municipality')"
                label="Municipio">
                <input
                  type="text"
                  formControlName="municipality"
                  class="form-control"
                  [readonly]="true" />
              </form-field>
            </div>
            <div class="col-md-12 mt-2">
              <form-field
                [control]="serviceOrdersForm.get('entity')"
                label="Entidad">
                <input
                  type="text"
                  formControlName="entity"
                  class="form-control"
                  [readonly]="true" />
              </form-field>
            </div>
            <div class="col-md-3 mt-2">
              <form-field
                [control]="serviceOrdersForm.get('supplierFolio')"
                label="Folio Proveedor">
                <input
                  type="text"
                  formControlName="supplierFolio"
                  class="form-control"
                  [readonly]="false" />
              </form-field>
            </div>
          </div>
        </form>
        <div class="row pt-4">
          <div class="col-md-12">
            <div [class]="loading ? 'table-loading' : ''">
              <ng2-smart-table
                [attr.class]="'table-bordered table-responsive'"
                [settings]="settings"
                [source]="dataLocalB">
              </ng2-smart-table>
            </div>
          </div>
          <app-pagination
            [params]="paramsB"
            [totalItems]="totalItemsB"></app-pagination>
        </div>
        <div class="d-flex justify-content-center">
          <div>
            <button
              class="btn btn-primary btn-sm active mr-2"
              (click)="Incorpora()">
              Incorpora Bienes
            </button>
          </div>
          <div>
            <button
              class="btn btn-danger btn-sm active mr-2"
              (click)="Delete()">
              Eliminar Bienes
            </button>
          </div>
          <div>
            <button
              class="btn btn-primary btn-sm active mr-2"
              (click)="Gprogram()">
              G. Programación
            </button>
          </div>
        </div>
      </div>
    </app-card>
  </div>
  <div class="col-4">
    <div class="row">
      <div class="col-12">
        <app-card [header]="true">
          <div class="ch-content" header>
            <h5 class="title">Fechas Eventos</h5>
          </div>
          <div body class="row">
            <form [formGroup]="serviceOrdersForm" class="form-material">
              <div class="col-12">
                <form-field
                  [control]="serviceOrdersForm.get('start')"
                  label="Inicio">
                  <input
                    type="text"
                    formControlName="start"
                    class="form-control"
                    bsDatepicker />
                </form-field>
              </div>
              <div class="col-12">
                <form-field
                  [control]="serviceOrdersForm.get('finished')"
                  label="Término">
                  <input
                    type="text"
                    formControlName="finished"
                    class="form-control"
                    bsDatepicker
                    [minDate]="serviceOrdersForm.get('start').value" />
                </form-field>
              </div>
              <div class="col-md-4 mt-2">
                <form-field
                  [control]="serviceOrdersForm.get('hour')"
                  label="Hora">
                  <input
                    type="number"
                    formControlName="hour"
                    class="form-control"
                    min="1"
                    max="12"
                    [readonly]="false" />
                </form-field>
              </div>
              <div class="col-md-4 mt-2">
                <form-field
                  [control]="serviceOrdersForm.get('minute')"
                  label="Minuto">
                  <input
                    type="number"
                    formControlName="minute"
                    class="form-control"
                    min="0"
                    max="59"
                    [readonly]="false" />
                </form-field>
              </div>
              <div class="col-md-4 mt-2">
                <form-field
                  [control]="serviceOrdersForm.get('ampm')"
                  label="Horario">
                  <ng-select class="form-control" formControlName="ampm">
                    <ng-option value="AM">AM</ng-option>
                    <ng-option value="PM">PM</ng-option>
                  </ng-select>
                </form-field>
              </div>
            </form>
          </div>
        </app-card>
      </div>
      <div class="col-12">
        <app-card [header]="true">
          <div class="ch-content" header>
            <h5 class="title">Cambio Estatus</h5>
          </div>
          <div body class="row">
            <form [formGroup]="serviceOrdersForm" class="form-material">
              <div class="col-12">
                <form-field
                  [control]="serviceOrdersForm.get('status')"
                  label="Estatus">
                  <ng-select class="form-control" formControlName="status">
                    <ng-option value="AUTORIZADA">Autorizada</ng-option>
                    <ng-option value="CANCELADA">Cancelada</ng-option>
                    <ng-option value="PROCESO">Proceso</ng-option>
                    <ng-option value="RECHAZADO">Rechazado</ng-option>
                  </ng-select>
                </form-field>
                <div>
                  <button
                    class="btn btn-primary btn-block btn-sm active"
                    (click)="openEstate('')">
                    Histórico
                  </button>
                </div>
              </div>
            </form>
          </div>
        </app-card>
      </div>
    </div>
  </div>
  <div class="col-12">
    <app-card [header]="true">
      <div class="ch-content" header>
        <h5 class="title">Control de las Ordenes de Servicio</h5>
      </div>
      <div body class="row">
        <div class="d-flex justify-content-end">
          <app-columns-select [(settings)]="settings2"></app-columns-select>
        </div>
        <div class="row pt-4">
          <div class="col-md-12">
            <div [class]="loading ? 'table-loading' : ''">
              <ng2-smart-table
                [settings]="settings2"
                [source]="dataLocalI"
                [attr.class]="'table-bordered table-responsive'">
              </ng2-smart-table>
            </div>
          </div>
          <app-pagination
            [params]="paramsI"
            [totalItems]="totalItemsI"></app-pagination>
        </div>
      </div>
    </app-card>
  </div>
</div>
