<app-modal>
  <div header>
    <h5 class="modal-title">Programación de Bienes</h5>
  </div>
  <div body>
    <div class="row pt-3">
      <form-loader *ngIf="loading"></form-loader>
      <div>
        <ng2-smart-table
          [ngStyle]="{
            height: loading ? '0px' : totalItems2 > 10 ? '300px' : 'auto'
          }"
          [attr.class]="'table-bordered table-responsive'"
          [settings]="settings2"
          [source]="localData2"
          (userRowSelect)="onRowSelect($event)">
        </ng2-smart-table>
      </div>
      <app-pagination
        [params]="params2"
        [totalItems]="totalItems2"></app-pagination>
    </div>
    <div class="d-flex justify-content-end">
      <app-columns-select [(settings)]="settings"></app-columns-select>
    </div>
    <div class="row pt-3">
      <form-loader *ngIf="loading2"></form-loader>
      <div>
        <ng2-smart-table
          [ngStyle]="{
            height: loading2 ? '0px' : totalItems > 10 ? '300px' : 'auto'
          }"
          [attr.class]="'table-bordered table-responsive'"
          [settings]="settings"
          [source]="localData"
          (userRowSelect)="selectRows($event.selected)">
        </ng2-smart-table>
      </div>
      <app-pagination
        [params]="params"
        [totalItems]="totalItems"></app-pagination>
    </div>
  </div>
  <div footer>
    <div class="d-flex justify-content-center">
      <div class="m-3">
        <confirm-button
          [text]="'Aplica'"
          [btnSmall]="true"
          [type]="'button'"
          (confirm)="Apply()"></confirm-button>
      </div>
      <div class="m-3">
        <button
          type="button"
          class="btn btn-sm btn-danger active"
          (click)="close()">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</app-modal>
