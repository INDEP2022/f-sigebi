<app-modal>
  <div header>
    <h5 class="modal-title">Ordenes de Servicio</h5>
  </div>
  <div body>
    <div class="row pt-4">
      <div class="col-md-12">
        <form-loader *ngIf="loading"></form-loader>
        <ng2-smart-table
          #myTable
          [ngStyle]="{
            height: loading ? '0px' : totalItems > 10 ? '300px' : 'auto'
          }"
          [attr.class]="'table-bordered table-responsive'"
          [settings]="settings"
          [source]="datalocal"
          (userRowSelect)="onRowSelect($event)">
        </ng2-smart-table>
      </div>
      <app-pagination
        [params]="params"
        [totalItems]="totalItems"></app-pagination>
    </div>
  </div>
  <div footer>
    <div class="d-flex justify-content-center mb-4">
      <div class="">
        <button
          type="button"
          class="btn btn-primary active btn-sm mr-3"
          (click)="selected()"
          [disabled]="selectedRow == null">
          Seleccionar <i class="fas fa-edit bx-sm float-icon"></i>
        </button>
      </div>
      <div class="">
        <button class="btn btn-danger active btn-sm" (click)="close()">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</app-modal>
