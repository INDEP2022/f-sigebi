<app-modal>
  <div header>
    <h5 class="modal-title">Editar Bien {{ goodNumber }}</h5>
  </div>
  <div body>
    <form class="form-material" [formGroup]="form">
      <div class="row">
        <div class="col-md-4 mt-2">
          <form-field [control]="form.get('id')" label="No. Bien">
            <input
              readonly
              type="text"
              class="form-control"
              formControlName="id" />
          </form-field>
        </div>
        <div class="col-md-4 mt-2">
          <form-field [control]="form.get('extDomProcess')" label="Ext Dominio">
            <input
              maxlength="20"
              type="text"
              class="form-control"
              formControlName="extDomProcess" />
          </form-field>
        </div>
        <div class="col-md-4 mt-2">
          <form-field [control]="form.get('quantity')" label="Cantidad">
            <input
              max="999999999999999"
              type="number"
              class="form-control"
              formControlName="quantity" />
          </form-field>
        </div>
        <div class="col-md-4 mt-2">
          <form-field [control]="form.get('appraisedValue')" label="Importe">
            <input
              max="99999999999999999"
              type="number"
              class="form-control"
              formControlName="appraisedValue" />
          </form-field>
        </div>
        <div class="col-md-4 mt-2">
          <form-field [control]="form.get('tesofeFolio')" label="Folio Tesofe">
            <input
              maxlength="20"
              type="text"
              class="form-control"
              formControlName="tesofeFolio" />
          </form-field>
        </div>
        <div class="col-md-4 mt-2">
          <form-field [control]="form.get('tesofeDate')" label="Fecha Tesofe">
            <input
              type="text"
              class="form-control"
              formControlName="tesofeDate"
              bsDatepicker />
          </form-field>
        </div>
        <div class="col-md-4 mt-2">
          <form-field
            [control]="form.get('scheduledDateDecoDev')"
            label="Fecha Decomiso">
            <input
              type="text"
              class="form-control"
              formControlName="scheduledDateDecoDev"
              bsDatepicker />
          </form-field>
        </div>
        <div class="col-md-8 mt-2">
          <form-field [control]="form.get('promoterUserDecoDevo')">
            <ngx-select
              [searchOnInit]="true"
              (fetchItems)="getUser($event)"
              [data]="userSele"
              [form]="form"
              value="user"
              bindLabel="name"
              label="Usuario"
              control="promoterUserDecoDevo">
            </ngx-select>
          </form-field>
        </div>
        <div class="col-md-12 mt-2">
          <form-field [control]="form.get('description')" label="Descripción">
            <textarea
              maxlenght="600"
              rows="4"
              type="text"
              class="form-control"
              formControlName="description">
            </textarea>
          </form-field>
        </div>
      </div>
    </form>
  </div>
  <div footer>
    <div class="d-flex justify-content-center">
      <div class="m-3">
        <button
          [disabled]="!form.valid"
          type="button"
          class="btn btn-primary btn-sm active"
          (click)="update()">
          Guardar <i aria-hidden="true" class="fa fa-save"></i>
        </button>
      </div>
      <div class="m-3">
        <button
          type="button"
          class="btn btn-danger active btn-sm"
          (click)="close()">
          Cancelar
        </button>
      </div>
    </div>
  </div>
</app-modal>
