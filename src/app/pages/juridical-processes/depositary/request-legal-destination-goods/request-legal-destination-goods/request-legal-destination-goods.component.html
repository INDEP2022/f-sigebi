<app-card [header]="true">
  <div class="ch-content" header>
    <h5 class="title">SOLICITUD DE DESTINO LEGAL PARA EL BIEN</h5>
  </div>

  <div body>
    <!-- form No Bien -->
    <form [formGroup]="form" class="container-fluid form-material">
      <div class="row">
        <div class="col-md-12">
          <form-field [control]="form.get('noBien')">
            <ngx-select
              (fetchItems)="getGoods($event)"
              [data]="goods"
              [form]="form"
              [showTooltip]="true"
              bindLabel="bindLabel"
              label="Bien"
              [searchable]="true"
              (change)="selectGood($event)"
              control="noBien">
            </ngx-select>
          </form-field>
        </div>
      </div>
      <div class="row w-100">
        <div
          class="col-sm-12 col-12 col-md-12 col-lg-12 p-2 mb-5 p-5"
          *ngIf="loading">
          <div class="d-flex justify-content-center">
            <div class="d-flex justify-content-center">
              <div class="loader"></div>
              <h6 class="loader-msg pt-3">Cargando... por favor espere...</h6>
            </div>
          </div>
        </div>
        <div class="col-sm-12 col-12 col-md-12 p-2"></div>
        <div class="col-12 col-sm-12 col-md-8">
          <h6>Pagos Recibidos en el Banco</h6>
        </div>
        <div class="col-12 col-sm-12 col-md-4 text-end">
          <app-columns-select
            [(settings)]="tableFactGenSettings"></app-columns-select>
        </div>
        <div
          class="col-sm-12 col-12 col-md-12 table-responsive p-1 mt-4 mb-4"
          style="max-height: 500px; overflow-y: scroll">
          <div [class]="loadingTable ? 'table-loading' : ''">
            <ng2-smart-table
              [attr.class]="'table-bordered table-responsive'"
              [settings]="tableFactGenSettings"
              [source]="dataFactGen">
              <!-- (userRowSelect)="selectRow($event, $event.data)" -->
            </ng2-smart-table>
          </div>
        </div>
        <div class="col-12">
          <!-- <app-pagination
          [params]="paramsPayBanks"
          [totalItems]="totalItemsPayBanks"></app-pagination> -->
        </div>
      </div>
    </form>
    <!-- form No Bien -->
  </div>
</app-card>
