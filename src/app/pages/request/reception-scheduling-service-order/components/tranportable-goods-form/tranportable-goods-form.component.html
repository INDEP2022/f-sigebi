<div class="row pt-4">
  <div class="md-tabs">
    <tabset>
      <tab heading="Bienes transportables">
        <div class="d-flex mb-3">
          <div class="mr-auto p-2"></div>
          <div class="p-2">
            <app-columns-select [(settings)]="settings"></app-columns-select>
          </div>
          <div class="p-2">
            <button (click)="detach()" class="btn btn-primary btn-sm active">
              Detach
            </button>
          </div>
        </div>

        <div [class]="loading ? 'table-loading' : ''">
          <ng2-smart-table
            [settings]="settings"
            [source]="data"
            (edit)="showDocument($event)">
          </ng2-smart-table>
        </div>

        <app-pagination
          [params]="params"
          [totalItems]="totalItems"></app-pagination>
      </tab>
    </tabset>
  </div>
</div>
