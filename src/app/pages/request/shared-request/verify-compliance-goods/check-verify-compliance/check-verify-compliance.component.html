<ng-container *ngIf="checkStateEditForm">
  <form
    [formGroup]="checkForm"
    class="form-material"
    style="min-width: 50px !important">
    <form-check label="" [for]="checkId">
      <input
        [id]="checkId"
        type="checkbox"
        formControlName="type"
        (change)="change($event)" />
    </form-check>
  </form>
</ng-container>
<ng-container *ngIf="!checkStateEditForm">
  <i *ngIf="value" class="bx bxs-check-square check-icon"></i>
  <i *ngIf="!value" class="bx bx-square check-icon"></i>
</ng-container>
