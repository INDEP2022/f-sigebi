<div style="height: 50px !important">
  <form
    [formGroup]="form"
    class="form-material"
    style="height: 100px !important">
    <ngx-select
      id="select-input"
      [form]="form"
      control="evaluation"
      [data]="list"
      bindLabel="description"
      [searchable]="false"
      label=""
      value="id"
      (change)="selectChange($event)"
      [readonly]="readonly"></ngx-select>
  </form>
</div>
