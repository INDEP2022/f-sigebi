<div class="row pt-3 mt-4">
  <div class="md-tabs">
    <tabset>
      <tab heading="{{ title }}">
        <div class="d-flex">
          <!-- btn-toolbar -->
          <div class="mr-auto p-2"></div>
          <div class="p-2">
            <button
              *ngIf="editable"
              (click)="newService()"
              class="btn btn-primary btn-sm active">
              Nuevo servico <i class="fa fa-plus-circle" aria-hidden="true"></i>
            </button>
          </div>
          <div class="p-2">
            <button
              *ngIf="editable"
              (click)="newServiceManual()"
              class="btn btn-info btn-sm active">
              Nuevo servicio manual
              <i class="fa fa-plus-circle" aria-hidden="true"></i>
            </button>
          </div>
          <div class="p-2">
            <button
              *ngIf="editable"
              (click)="deleteService()"
              class="btn btn-danger btn-sm active">
              Eliminar servicio <i class="fa fa-trash" aria-hidden="true"></i>
            </button>
          </div>
          <!--<div class="p-2">
            <button class="btn btn-primary btn-sm active">Detach</button>
          </div> -->
        </div>
        <div class="d-flex" *ngIf="op == 5 && typeOrder != 'reception'">
          <div class="p-2">
            <div class="">
              <label class="">Resultado evaluaci&oacute;n&#58;</label>
            </div>
          </div>
          <div class="p-2">
            <input
              type="text"
              class="form-control"
              style="width: 97px; height: 24px" />
          </div>
          <div class="p-2">
            <input
              type="text"
              class="form-control"
              style="width: 97px; height: 24px" />
          </div>
        </div>
        <div>
          <div class="row pt-4">
            <div class="col-md-12">
              <div [class]="loading ? 'table-loading' : ''">
                <ng2-smart-table
                  #table
                  id="table"
                  [attr.class]="'table-bordered table-responsive'"
                  [settings]="settings"
                  [source]="data"
                  (userRowSelect)="onSelectedRows($event)"
                  ><!-- (edit)="showDocument()" -->
                </ng2-smart-table>

                <div class="table-footer">
                  <div style="width: 100%"></div>
                  <b class="mr-4">Total:</b> {{ totalAmount }}
                </div>
              </div>

              <app-pagination
                [params]="params"
                [totalItems]="totalItems"></app-pagination>
            </div>
          </div>
        </div>
      </tab>
    </tabset>
  </div>
</div>
