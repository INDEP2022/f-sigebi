<h5 class="title">
  <p>
    <a
      class="text-color"
      (click)="showOrderservice = true"
      *ngIf="!showOrderservice">
      <i class="fa fa-angle-right" aria-hidden="true"></i>Órden de Servicio</a
    >
  </p>

  <p>
    <a
      class="text-color"
      (click)="showOrderservice = false"
      *ngIf="showOrderservice">
      <i class="fa fa-angle-down" aria-hidden="true"></i>Órden de Servicio</a
    >
  </p>
</h5>

<div body style="margin-top: -30px">
  <div class="justify-content-end btn-toolbar mt-4">
    <button
      *ngIf="btnRechazarJustificacion"
      class="btn btn-info btn-sm active"
      (click)="refuseJustification()">
      Rechazar Justificación <i class="fa fa-reply" aria-hidden="true"></i>
    </button>
  </div>
</div>

<div class="pt-3 mt-4" *ngIf="showOrderservice">
  <div class="row">
    <form class="form-horizontal" style="margin: 0 auto">
      <div class="col-md-4">
        <div class="form-group">
          <label class="col-lg-6 text-right">Folio Órden Servicio&#58;</label>
          <span> {{ orderService?.serviceOrderFolio }} </span>
        </div>

        <div class="form-group">
          <label class="col-lg-6 text-right"
            >Folio reporte implementación&#58;</label
          >
          <span> {{ orderService?.folioReportImplementation }} </span>
        </div>

        <div class="form-group">
          <label class="col-lg-6 text-right">Fecha turnado&#58;</label>
          <span> {{ orderService?.shiftDate | date : 'dd/MM/yyyy' }} </span>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="col-lg-7 text-right">Usuario Turnado&#58;</label>
          <span> {{ orderService?.shiftUser }} </span>
        </div>

        <div class="form-group">
          <label class="col-lg-7 text-right">No. Contrato&#58;</label>
          <span> {{ orderService?.contractNumber }} </span>
        </div>

        <div class="form-group">
          <label class="col-lg-7 text-right">Transporte zona&#58;</label>
          <input
            style="width: 20% !important"
            type="text"
            class="form-control"
            formControlName="transportationZone" />
        </div>

        <div class="form-group">
          <label class="col-lg-7 text-right">Folio TLP&#58;</label>
          <input
            style="width: 40% !important"
            type="text"
            class="form-control"
            formControlName="folioTlp" />
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <label class="col-lg-5 text-right">Visita ocular&#58;</label>
          <input
            id="checkGoodVisit"
            [disabled]="ordServform.disabled"
            type="checkbox"
            [(ngModel)]="visitEye"
            [ngModelOptions]="{ standalone: true }"
            (change)="changeVisitEye($event)" />
        </div>

        <div class="form-group">
          <label class="col-lg-5 text-right"
            >Razones de no realización&#58;</label
          >
          <input
            style="width: 50% !important"
            class="form-control"
            formControlName="reasonsNotPerform" />
        </div>
        <div class="form-group">
          <label class="col-lg-5 text-right"
            >Consolidado con contenedores&#58;</label
          >
          <input
            id="checkGood"
            type="checkbox"
            [disabled]="ordServform.disabled"
            [(ngModel)]="consolideContainer"
            [ngModelOptions]="{ standalone: true }"
            (change)="changeConsolidate($event)" />
        </div>
        <div class="form-group">
          <label style="font-size: 23px" class="col-lg-5 text-right"
            >Total&#58;</label
          >
          <b style="font-size: 23px"> {{ total }} </b>
        </div>
      </div>
    </form>
  </div>
</div>
