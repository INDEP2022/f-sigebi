<div class="pt-3">
  <h5 class="title">
    <p>
      <a class="text-color" (click)="showComments = true" *ngIf="!showComments">
        <i class="fa fa-angle-right" aria-hidden="true"></i> Comentarios</a
      >
    </p>

    <p>
      <a class="text-color" (click)="showComments = false" *ngIf="showComments">
        <i class="fa fa-angle-down" aria-hidden="true"></i> Comentarios</a
      >
    </p>
  </h5>
  <div class="pt-3" *ngIf="showComments">
    <form [formGroup]="ordServform" class="form-material" *ngIf="showComments">
      <div class="row mt-4">
        <div class="col-md-12">
          <form-field
            [control]="ordServform.get('observation')"
            label="Observaciones">
            <textarea
              class="form-control"
              formControlName="observation"></textarea>
          </form-field>
        </div>
      </div>
      <div class="row pt-3">
        <div class="col-md-12">
          <form-field [control]="ordServform.get('notes')" label="Notas">
            <textarea class="form-control" formControlName="notes"></textarea>
          </form-field>
        </div>
      </div>
      <div class="row pt-3">
        <div class="col-md-12">
          <form-field
            [control]="ordServform.get('commentRejection')"
            label="Comentario de Rechazo">
            <textarea
              class="form-control"
              formControlName="commentRejection"></textarea>
          </form-field>
        </div>
      </div>
    </form>
  </div>
</div>
