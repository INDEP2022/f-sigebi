<div class="pt-3">
  <h5 class="title">
    <p>
      <a
        class="text-color"
        (click)="showClassificateVehicle = true"
        *ngIf="!showClassificateVehicle">
        <i class="fa fa-angle-right" aria-hidden="true"></i>
        Clasificación Vehículos</a
      >
    </p>

    <p>
      <a
        class="text-color"
        (click)="showClassificateVehicle = false"
        *ngIf="showClassificateVehicle">
        <i class="fa fa-angle-down" aria-hidden="true"></i> Clasificación
        Vehículos</a
      >
    </p>
  </h5>

  <div class="row" *ngIf="showClassificateVehicle">
    <div class="d-flex mb-3">
      <div class="mr-auto p-2"></div>
      <div class="p-2">
        <button
          *ngIf="editable"
          (click)="formClassificateVehicle()"
          class="btn btn-primary btn-sm active">
          Nuevo <i class="bx bx-plus bx-sm float-icon"></i>
        </button>
      </div>
      <div class="p-2">
        <button
          *ngIf="editable"
          (click)="editClassificateVehicle()"
          class="btn btn-info btn-sm active">
          Editar <i class="fa fa-pencil-alt"></i>
        </button>
      </div>
    </div>
    <div [class]="loading ? 'table-loading' : ''">
      <ng2-smart-table
        [settings]="settings"
        [source]="data"
        (userRowSelect)="selectItem($event)">
      </ng2-smart-table>
    </div>

    <app-pagination
      [params]="params"
      [totalItems]="totalItems"></app-pagination>
  </div>
</div>
